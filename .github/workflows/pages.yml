name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage compact guest assets on the Pages origin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p armv7/assets
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/kitkat-api19-armv7-assets-v3"
          for file in qemu-system-arm-wasm.zip kernel-qemu ramdisk.img system.img userdata.img; do
            curl --fail --location --retry 3 "$base/$file" -o "armv7/assets/$file"
          done
          ls -lh armv7/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
