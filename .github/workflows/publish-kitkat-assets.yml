name: Publish compact KitKat browser assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-kitkat-assets.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download QEMU WebAssembly artifact
        uses: actions/download-artifact@v4
        with:
          name: qemu-system-arm-wasm-baseline
          path: qemu
          repository: ${{ github.repository }}
          run-id: 41417879412
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Android 4.4 ARMv7 artifact
        uses: actions/download-artifact@v4
        with:
          name: android-4.4-api19-armv7-sdk-image
          path: guest
          repository: ${{ github.repository }}
          run-id: 41414728013
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and compact guest images
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q guest/android-19-armeabi-v7a.zip -d extracted
          find extracted -type f -maxdepth 4 -printf '%p %s bytes\n'
          base="$(find extracted -name kernel-qemu -type f | head -1)"
          ram="$(find extracted -name ramdisk.img -type f | head -1)"
          sys="$(find extracted -name system.img -type f | head -1)"
          usr="$(find extracted -name userdata.img -type f | head -1)"
          test -s "$base" && test -s "$ram" && test -s "$sys" && test -s "$usr"
          cp "$base" kernel-qemu
          cp "$ram" ramdisk.img
          for img in "$sys" "$usr"; do
            e2fsck -fy "$img" || true
            resize2fs -M "$img"
            e2fsck -fy "$img" || true
            blocks="$(dumpe2fs -h "$img" 2>/dev/null | awk -F: '/^Block count:/ {gsub(/ /,"",$2); print $2}')"
            blocksize="$(dumpe2fs -h "$img" 2>/dev/null | awk -F: '/^Block size:/ {gsub(/ /,"",$2); print $2}')"
            test -n "$blocks" && test -n "$blocksize"
            truncate -s "$((blocks * blocksize))" "$img"
          done
          cp "$sys" system.img
          cp "$usr" userdata.img
          ls -lh kernel-qemu ramdisk.img system.img userdata.img

      - name: Package QEMU runtime
        shell: bash
        run: |
          set -euo pipefail
          test -s qemu/qemu-system-arm.js
          test -s qemu/qemu-system-arm.wasm
          test -s qemu/qemu-system-arm.worker.js
          (cd qemu && zip -9 ../qemu-system-arm-wasm.zip qemu-system-arm.js qemu-system-arm.wasm qemu-system-arm.worker.js)

      - name: Publish compact assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kitkat-api19-armv7-assets-v3
          name: KitKat API 19 ARMv7 compact browser assets
          prerelease: true
          make_latest: false
          files: |
            qemu-system-arm-wasm.zip
            kernel-qemu
            ramdisk.img
            system.img
            userdata.img
