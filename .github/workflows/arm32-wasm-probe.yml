name: Build ARM32 QEMU WebAssembly baseline

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/arm32-wasm-probe.yml"
  push:
    branches: [armv7-port-scaffold]
    paths:
      - ".github/workflows/arm32-wasm-probe.yml"

permissions:
  contents: read

jobs:
  build-arm32-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Fetch QEMU 10.1 source
        run: |
          set -euxo pipefail
          curl -fL https://download.qemu.org/qemu-10.1.0.tar.xz -o qemu.tar.xz
          mkdir qemu-src
          tar -xJf qemu.tar.xz --strip-components=1 -C qemu-src

      - name: Build Emscripten cross toolchain image
        run: |
          set -euxo pipefail
          # QEMU's Dockerfile expects zlib .tar.xz, but zlib fossils provide this release as .tar.gz.
          cp qemu-src/tests/docker/dockerfiles/emsdk-wasm32-cross.docker /tmp/emsdk-wasm32-cross.docker
          sed -i 's#curl -Ls https://zlib.net/zlib-$ZLIB_VERSION.tar.xz | \\#curl -fLs https://zlib.net/fossils/zlib-$ZLIB_VERSION.tar.gz | \\#' /tmp/emsdk-wasm32-cross.docker
          sed -i 's#tar xJC /zlib#tar xzC /zlib#' /tmp/emsdk-wasm32-cross.docker
          docker build --progress=plain -t qemu101-wasm-base -f /tmp/emsdk-wasm32-cross.docker qemu-src

      - name: Configure and compile 32-bit ARM system emulator
        run: |
          set -euxo pipefail
          mkdir -p build
          docker run --rm \
            -v "$PWD/qemu-src:/qemu-src" \
            -v "$PWD/build:/build" \
            -w /build \
            qemu101-wasm-base \
            bash -lc '
              set -euxo pipefail
              emconfigure /qemu-src/configure \
                --static \
                --target-list=arm-softmmu \
                --without-default-features \
                --enable-system \
                --enable-tcg-interpreter \
                --disable-tools \
                --disable-docs \
                --disable-pie
              ninja -j"$(nproc)" qemu-system-arm.js
              test -s qemu-system-arm.js
              test -s qemu-system-arm.wasm
              test -s qemu-system-arm.worker.js
            '

      - name: Upload ARM32 WebAssembly build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-arm-wasm-baseline
          path: |
            build/qemu-system-arm.js
            build/qemu-system-arm.wasm
            build/qemu-system-arm.worker.js
          if-no-files-found: error
          retention-days: 14
